    <script>
      // Ignore HMR WebSocket connection errors in iframe environment
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = reason ? (reason.message || String(reason)) : '';
        var stack = reason && reason.stack ? reason.stack : '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite:ws') !== -1 || stack.indexOf('@vite/client') !== -1) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = event ? (event.message || '') : '';
        var filename = event && event.filename ? event.filename : '';
        if (msg.indexOf('WebSocket') !== -1 || filename.indexOf('@vite/client') !== -1) {
          event.preventDefault();
        }
      });
    </script>
